<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App checks</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 20px; background: #15181c; color: #e6e9ed; }
  .r { padding: 6px 10px; margin: 4px 0; border-left: 4px solid #58c08a; background: #1d2126; }
  .r.fail { border-color: #ef6b6b; }
  iframe { width: 1280px; height: 800px; border: 0; position: absolute; left: -3000px; }
</style>
</head>
<body>
<h1>Open Nova app checks</h1>
<p>Shell, drivers, card / port naming, live-apply fingerprint, guard locations, library levels, .uscr import, Arrange.
The app runs in a hidden frame with saving and sync switched off: nothing is stored and no processor is contacted.</p>
<div id="sum"></div><div id="out"></div>
<iframe id="app" src="../index.html"></iframe>
<script>
var out = document.getElementById('out'), fails = 0, passes = 0, pending = 0;
function row(ok, text) { var d = document.createElement('div'); d.className = 'r' + (ok ? '' : ' fail'); d.textContent = (ok ? 'PASS ' : 'FAIL ') + text; out.appendChild(d); if (ok) passes++; else fails++; }
// a check passes only on an explicit true; anything else (false, a failure message, undefined, a truthy object) fails and is shown
function t(name, fn) { try { var r = fn(); row(r === true, name + (r === true ? '' : ' — ' + (typeof r === 'string' ? r : 'returned ' + (r === undefined ? 'nothing' : JSON.stringify(r))))); } catch (e) { row(false, name + ' — threw ' + e.message); } }
// Checks that need the frame to themselves (they stub DRV.post / swap the project): queued, run one after another once the
// other async checks are done; fn(done) calls done() when finished.
var lastQ = [], realMark = null;   // realMark: the app's hltErrMark (stubbed in the frame, used by heldSyncTest)
function atEnd(fn) {
  pending++; lastQ.push(fn);
  if (lastQ.length === 1) (function go() { if (pending > lastQ.length) return setTimeout(go, 50); lastQ[0](function () { lastQ.shift(); pending--; if (lastQ.length) go(); }); })();
}
var f = document.getElementById('app');
f.onload = function () {
  var w = f.contentWindow, tries = 0;
  (function wait() {
    if (!(w.OpenNova && typeof w.setTab === 'function') && tries++ < 100) return setTimeout(wait, 100);
    // no storing, no sync, no live apply, no helper calls from this test
    w.saveLocal = function () {}; w.schedulePush = function () {}; w.liveApplySchedule = function () {};
    w.toast = function () {};
    // no network search from this frame (app-online.js): no Add processor / background search, no read-back, no H web
    w.olSearch = function () {}; w.rbAuto = function () {}; w.olWebRefresh = function () {}; w.hw.bgAt = Date.now() + 1e9;
    // projects here without a workspace count as offline: no automatic simulated processors (offline_test.html checks those)
    w.simEnsure = function () {};
    // the kept monitor errors stay in this frame (not sent to / read from the server's list); background readings don't latch
    realMark = w.hltErrMark; w.hltErrMark = function () {}; w.hltErrLoad = function () { return Promise.resolve(); };
    run(w);
    (function done(n) { if (pending && n < 50) return setTimeout(function () { done(n + 1); }, 100);
    document.getElementById('sum').innerHTML = '<p class="r' + (fails ? ' fail' : '') + '">' + (fails ? fails + ' failed, ' + passes + ' passed' : 'All passed (' + passes + ')') + '</p>';
    document.title = (fails ? 'FAIL ' : 'PASS ') + 'app checks'; })(0);
  })();
};
function run(w) {
  var P = function () { return w.P; };
  // ---------------------------------------------------------------- shell
  t('every tab has a unique id and its main view exists', function () {
    var ids = w.TABS.map(function (x) { return x.id; });
    if (new Set(ids).size !== ids.length) return false;
    var miss = w.TABS.filter(function (x) { return !w.document.getElementById(x.main); }).map(function (x) { return x.id; });
    return miss.length ? 'missing ' + miss.join(', ') : true;
  });
  t('UI cleanup: opens on the dashboard; Source hidden; the menu bar holds File / Tools / Settings / Help; Export its own button; no Send on Device', function () {
    var d = w.document, $ = function (id) { return d.getElementById(id); }, bad = [];
    if (w.ui.tab !== 'dashboard') bad.push('started on ' + w.ui.tab);
    if (!$('tabSource').hidden) bad.push('Source tab shown');
    if ($('btnProjMenu') || $('btnToolsMenu')) bad.push('old Project ▾ / Tools ▾ still in the header');
    var mbar = $('menuBar'), tops = Array.prototype.map.call(d.querySelectorAll('#menuBar .mb-top'), function (b) { return b.textContent.trim(); }).join(' ');
    if (!mbar || mbar.nextElementSibling !== d.querySelector('header.bar')) bad.push('menu bar not above the tabs');
    if (tops !== 'File Edit View Tools Settings Help') bad.push('menu titles: ' + tops);
    [['projMenu', 'btnNew projList btnSaveProject btnReadLayout btnExportScfg fileOpen fileInto'], ['toolsMenu', 'btnSupport btnOfflineMode mbDiscover mbTestTool mbPreshow'],
      ['settingsMenu', 'btnLogs btnTheme uiSizeBtns mbAlarms'], ['helpMenu', 'btnKeys mbManual mbAbout']].forEach(function (g) {
      g[1].split(' ').forEach(function (id) { if (!$(id) || !$(id).closest('#' + g[0])) bad.push(id + ' not in #' + g[0]); });
    });
    if ($('btnExport').closest('.dropmenu') || $('btnExport').textContent.trim() !== 'Export' || $('btnExport').classList.contains('primary')) bad.push('Export button');
    ['btnBlackout', 'btnFreeze', 'btnNormalHdr', 'btnSendHdr', 'btnSaveHw'].forEach(function (id) { if ($(id).closest('.dropmenu')) bad.push(id + ' in a menu'); });
    w.setTab('source'); if (w.ui.tab === 'source') bad.push('setTab(source) opened it');
    w.setTab('devices');
    if (w.P.devices.length && d.querySelector('#dvHwBody [data-hw="send"]')) bad.push('Send button on the Hardware card');
    if (w.P.devices.length && !$('dvService').classList.contains('collapsed')) bad.push('Service open');
    if ($('dvEarlier') || $('dvLater') || $('bkMiniText')) bad.push('removed controls still in the page');
    w.setTab('layout');
    return bad.length ? bad.join('; ') : true;
  });
  // ---------------------------------------------------------------- Settings ▸ Network… (app-network.js; the helper is stubbed)
  var NW_DEMO = { ok: true, platform: 'win32', saved: true, settings: { disabled: ['Wi-Fi'], bind: 'all' }, plan: { choice: 'all', hosts: null, note: '' },
    applied: { choice: 'all', hosts: null, note: '' }, state: { seq: 3, events: [] }, interfaces: [
      { name: 'Ethernet 2', label: 'Intel(R) Ethernet', type: 'ethernet', up: true, search: true, ipv4: [{ ip: '192.168.0.10', prefix: 24, broadcast: '192.168.0.255' }], found: [{ ip: '192.168.0.11', kind: 'lct' }] },
      { name: 'Ethernet 3', label: 'Realtek USB GbE Family Controller', type: 'ethernet', up: true, search: true, ipv4: [{ ip: '192.168.0.20', prefix: 24, broadcast: '192.168.0.255' }], found: [] },
      { name: 'Wi-Fi', label: 'Intel(R) Wi-Fi 6', type: 'wifi', up: false, search: false, ipv4: [], found: [] },
      { name: 'Tailscale', label: 'Tailscale Tunnel', type: 'vpn', up: true, search: true, ipv4: [{ ip: '100.101.102.103', prefix: 32, broadcast: '' }], found: [] },
      { name: 'Loopback Pseudo-Interface 1', label: 'this computer', type: 'loopback', up: true, search: false, ipv4: [{ ip: '127.0.0.1', prefix: 8, broadcast: '' }], found: [] }] };
  t('Settings ▸ Network…: in the Settings menu; the dialog lists each interface (tick, type, address, processors found), Loopback without a tick, App reachable from', function () {
    var d = w.document, bad = [], keepFound = w.hw.found, keepHelper = w.hw.helper;
    if (!d.getElementById('mbNetwork') || !d.getElementById('mbNetwork').closest('#settingsMenu')) return 'Network… not in the Settings menu';
    w.hw.found = [{ kind: 'lct', ip: '192.168.0.11%Ethernet 2', addr: '192.168.0.11', port: 5200, iface: 'Ethernet 2', deviceName: 'H5', senders: [], conflict: 'Two networks each have a processor at 192.168.0.11 (Ethernet 2, Ethernet 3) — Open Nova reaches each through its own network' },
      { kind: 'lct', ip: '192.168.0.11%Ethernet 3', addr: '192.168.0.11', port: 5200, iface: 'Ethernet 3', deviceName: 'H2', senders: [] }];
    try {
      w.nwOpen(JSON.parse(JSON.stringify(NW_DEMO)));
      var rows = d.querySelectorAll('#nwBody .nw-row');
      if (rows.length !== 5) bad.push(rows.length + ' rows');
      var ticks = Array.prototype.map.call(d.querySelectorAll('#nwBody [data-nw="search"]'), function (b) { return b.dataset.n + (b.checked ? '+' : '-'); }).join(' ');
      if (ticks !== 'Ethernet 2+ Ethernet 3+ Wi-Fi- Tailscale+') bad.push('ticks ' + ticks);
      if (!/H5 · 192\.168\.0\.11:5200/.test(rows[0].textContent) || /%/.test(rows[0].textContent)) bad.push('found on Ethernet 2: ' + rows[0].textContent);
      if (!/H2/.test(rows[1].textContent)) bad.push('found on Ethernet 3: ' + rows[1].textContent);
      if (!/not connected/.test(rows[2].textContent)) bad.push('Wi-Fi not shown as not connected');
      var opts = Array.prototype.map.call(d.querySelectorAll('#nwBind option'), function (o) { return o.value; }).join('|');
      if (opts !== 'all|localhost|Ethernet 2|Ethernet 3|Tailscale') bad.push('bind options ' + opts);
      if (!/Now: every network/.test(d.getElementById('nwBody').textContent)) bad.push('no "Now:" line');
      if (w.hwWhere('192.168.0.11%Ethernet 3', 5200) !== '192.168.0.11:5200') bad.push('hwWhere keeps the zone');
      if (w.nwOf({ kind: 'lct', host: '192.168.0.11%Ethernet 3' }) !== 'Ethernet 3') bad.push('nwOf zone');
      if (JSON.stringify(w.nwInfoRow({ hw: { kind: 'lct', host: '192.168.0.11%Ethernet 2' } })) !== '[["Network","Ethernet 2"]]') bad.push('Device info row');
      w.hw.helper = true; var pick = w.olFoundHtml();
      if (!/192\.168\.0\.11:5200 · Ethernet 2/.test(pick) || !/Two networks/.test(pick)) bad.push('Add processor list: no interface / flag');
    } finally { w.hw.found = keepFound; w.hw.helper = keepHelper; w.nwClose(); }
    return bad.length ? bad.join('; ') : true;
  });
  t('switching tabs shows its view and closes open menus', function () {
    w.mbOpen('toolsMenu'); var m = w.document.getElementById('toolsMenu'); if (m.hidden) return 'Tools did not open';
    w.setTab('library');
    var ok = !w.document.getElementById('modLibrary').hidden && w.document.getElementById('modLayout').hidden && m.hidden && !w.mbOpenName() && !w.document.querySelector('#menuBar .mb-top.on');
    w.setTab('layout'); return ok && !w.document.getElementById('modLayout').hidden;
  });
  t('menu bar: click opens, hover moves, a submenu opens, Esc closes; Edit greys the Layout commands off Layout', function () {
    var d = w.document, $ = function (id) { return d.getElementById(id); }, bad = [];
    w.setTab('dashboard'); w.mbClose(); w.devClosePicker();   // a blank project opens "Which processors?" at start; it takes Esc
    $('mbFile').click(); if (w.mbOpenName() !== 'projMenu') bad.push('File did not open');
    $('mbEdit').dispatchEvent(new w.MouseEvent('mouseover', { bubbles: true })); if (w.mbOpenName() !== 'editMenu') bad.push('hover did not move to Edit');
    var off = Array.prototype.filter.call($('editMenu').querySelectorAll('button'), function (b) { return b.getAttribute('aria-disabled') === 'true'; }).map(function (b) { return b.textContent; }).join();
    if (!/Copy/.test(off) || !/Group/.test(off) || !/Select All/.test(off)) bad.push('Edit off Layout not greyed: ' + off);
    $('mbSettings').click(); var sb = $('settingsMenu').querySelector('.mb-subbtn'); sb.click();
    if (sb.parentNode.lastElementChild.hidden) bad.push('Preferences › did not open');
    w.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));   // closes the submenu
    if (!sb.parentNode.lastElementChild.hidden || w.mbOpenName() !== 'settingsMenu') bad.push('first Esc should close only Preferences ›');
    w.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));   // then the menu
    if (w.mbOpenName()) bad.push('Esc left ' + w.mbOpenName() + ' open');
    w.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'F10', bubbles: true })); if (w.mbOpenName() !== 'projMenu') bad.push('F10 did not open File');
    w.mbClose();
    w.setTab('layout'); $('mbView').click();
    var wires = Array.prototype.filter.call($('viewMbMenu').querySelectorAll('button'), function (b) { return /Wires/.test(b.textContent); })[0], was = $('showWires').checked;
    wires.click(); var now = $('showWires').checked; $('showWires').checked = was; $('showWires').dispatchEvent(new w.Event('change'));
    if (now === was || w.ui.showWires !== was) bad.push('View ▸ Wires did not toggle the canvas checkbox');
    if (w.mbOpenName()) bad.push('an item click left the menu open');
    return bad.length ? bad.join('; ') : true;
  });
  // ---------------------------------------------------------------- drivers
  t('all four drivers are registered', function () { return ['lct', 'unico', 'coex', 'offline'].every(function (k) { return w.DRV.families[k]; }); });
  t('every capability a driver claims has its method', function () {
    var bad = [];
    Object.keys(w.DRV.families).forEach(function (k) {
      var x = w.DRV.families[k], c = x.caps({ model: 'mctrl4k', hw: null }) || {};
      if (!x.identify) bad.push(k + ' identify');
      if (c.verify && (c.verify.backup || c.verify.primary) && !x.verifyBackup) bad.push(k + ' verifyBackup');
      if (c.presets && !x.presets) bad.push(k + ' presets');
      if (c.schedule && !x.schedules) bad.push(k + ' schedules');
      if (c.rcvFile && (c.rcvFile.ncp || c.rcvFile.rcfgx) && !x.sendRcvFile) bad.push(k + ' sendRcvFile');
      if (c.save && !x.save) bad.push(k + ' save');
    });
    return bad.length ? bad.join(', ') : true;
  });
  // ---------------------------------------------------------------- a fresh project (in memory only)
  w.replaceProject(w.ensureLct(w.newProject()));   // a new project has no processor (2026-10-11)
  var d0 = w.addProcessor('mctrl4k');
  t('a fixed processor (MCTRL4K) has no “sending card”: name and port label', function () {
    return !w.cardIsReal(0) && w.cardName(0) === w.deviceLabel(d0) && w.portLabel(0, 2) === 'P3' || 'got ' + w.cardName(0) + ' / ' + w.portLabel(0, 2);
  });
  var d1 = w.addProcessor('mctrl4k');
  t('with two processors a port names its processor', function () {
    var l = w.portLabel(1, 0); return l === w.deviceLabel(d1) + ' P1' || 'got ' + l;
  });
  w.setProcessorModel(d0, 'h5');
  t('a chassis (H5) keeps sending cards: “Sending card 1”, “S1 P3”', function () {
    return w.cardIsReal(0) && w.cardName(0) === 'Sending card 1' && w.portLabel(0, 2) === 'S1 P3' || 'got ' + w.cardName(0) + ' / ' + w.portLabel(0, 2);
  });
  w.setProcessorModel(d0, 'mctrl4k');
  // a section on the first processor
  var s = w.newScreen(0, 0); s.cols = 4; s.rows = 2; s.wiring.sender = 0; s.wiring.port = 0; P().screens.push(s); w.commit(); w.renderAll();
  (function () {   // async: its row is added when the promise settles
    var placed = w.hwPortCells(), want = Object.keys(placed).filter(function (k) { return +k.split(':')[0] === 0; }).map(function (k) { return k.split(':')[1] + '=' + placed[k].length; }).sort().join();
    pending++;
    w.DRV.families.offline.detect(d0).then(function (r) {
      var got = Object.keys(r.cards[0].ports).map(function (p) { return p + '=' + r.cards[0].ports[p].length; }).sort().join();
      row(want && got === want, 'the simulated driver detects exactly what the project places (' + got + ')');
    }, function (e) { row(false, 'simulated detect threw ' + e.message); }).then(function () { pending--; });
  })();
  t('live-apply fingerprint: same project → same, moved section → different', function () {
    var a = w.liveKey(d0), b = w.liveKey(d0); s.x += 128; var c = w.liveKey(d0); s.x -= 128;
    return a && a === b && a !== c || [a, b, c].join(' / ');
  });
  // ---------------------------------------------------------------- guard locations + library levels
  t('guard location text joins cable runs', function () {
    var txt = w.rcvWhere([0, 1, 2, 5].map(function (i) { return { card: 0, port: 1, index: i, dst: 0 }; }));
    return /P2 · cabinets 1–3, 6/.test(txt) || txt;
  });
  t('guard location text names a card the project doesn’t know', function () {
    var txt = w.rcvWhere([{ card: null, dst: 3, port: 0, index: 0 }]); return /output card 4 \(not in the project\)/.test(txt) || txt;
  });
  t('library levels: mixed wall = “fits some”, none = block, ok stays ok', function () {
    return w.lbLevel({ level: 'block', sendable: 3 }) === 'part' && w.lbLevel({ level: 'block', sendable: 0 }) === 'block' && w.lbLevel({ level: 'ok' }) === 'ok';
  });
  // ---------------------------------------------------------------- .uscr import with 64-bit cabinet IDs
  t('.uscr import keeps cable positions of 64-bit IDs (written as numbers)', function () {
    var id = function (port, idx) { return ((BigInt(0xABCDEF) << 32n) | (1n << 24n) | (BigInt(port) << 16n) | BigInt(idx)).toString(); };
    var topo = '{"data":{"canvasInfoList":[{"canvasPosition":{"x":0,"y":0},"topologyList":[' +
      [[2, 5, 0], [2, 6, 128], [0, 0, 256]].map(function (q) { return '{"cid":' + id(q[0], q[1]) + ',"cabinetPosition":{"x":' + q[2] + ',"y":0},"cabinetSize":{"width":128,"height":128}}'; }).join(',') + ']}]}}';
    var before = P().lct.length; w.ui.mSender = 0; w.importUscr(topo, 'test.uscr');
    var lc = P().lct[P().lct.length - 1], sec = P().screens.filter(function (x) { return x.screenId === lc.id; })[0];
    if (P().lct.length !== before + 1 || !sec) return 'not imported';
    var m = Object.keys(sec.manual).map(function (k) { return sec.manual[k].port + ':' + sec.manual[k].connect; }).sort().join(',');
    return m === '0:0,2:5,2:6' || 'got ' + m;
  });
  t('.uscr import refuses to grow a fixed processor’s card', function () {
    var id = ((BigInt(1) << 32n) | (1n << 24n) | (20n << 16n)).toString();   // port 21 on a 16-port MCTRL4K
    var n = P().lct.length; w.ui.mSender = 0;
    w.importUscr('{"data":{"canvasInfoList":[{"topologyList":[{"cabinetID":"' + id + '","cabinetPosition":{"x":0,"y":0},"cabinetSize":{"width":64,"height":64}}]}]}}', 'big.uscr');
    return P().lct.length === n && P().processors[0].ports === 16 || 'ports ' + P().processors[0].ports;
  });
  // ---------------------------------------------------------------- Open file… = a new project (as VMP); Import into this project
  t('Open file… makes a new project named after the file; Import into this project… replaces this one', function () {
    var keep = [w.projShared, w.projCreate], made = [];
    w.projShared = function () { return true; };
    w.projCreate = function (pj, done) { made.push(pj.name); w.replaceProject(pj); if (done) done(); };   // stand-in: no server here
    try {
      var id = ((BigInt(0x123456) << 32n) | (1n << 24n) | (1n << 16n) | 3n).toString();
      w.importUscr('{"data":{"canvasInfoList":[{"topologyList":[{"cid":' + id + ',"cabinetPosition":{"x":0,"y":0},"cabinetSize":{"width":64,"height":64}}]}]}}', 'Wall B.uscr', true);
      var oneScreen = P().lct.length === 1 && P().lct[0].name === 'Wall B' && P().screens.length === 1 && P().screens[0].manual['0'].port === 1;
      var pj = w.ensureLct(w.newProject()); pj.name = 'inside name';
      w.importTake(pj, 'Show A.ledmap.json', true);
      var named = P().name === 'Show A';
      var pj2 = w.ensureLct(w.newProject()); pj2.name = 'Kept';
      w.importTake(pj2, 'Other.scr', false);
      return made.join('|') === 'Wall B|Show A' && oneScreen && named && P().name === 'Kept' || 'made ' + made.join('|') + ', one screen ' + oneScreen + ', name ' + P().name;
    } finally { w.projShared = keep[0]; w.projCreate = keep[1]; w.replaceProject(w.ensureLct(w.newProject())); w.addProcessor('mctrl4k'); }
  });
  // ---------------------------------------------------------------- Arrange
  t('Arrange ▸ align left lines sections up', function () {
    w.showScreen(P().lct[0].id);
    var a = w.newScreen(0, 0), b = w.newScreen(700, 300); [a, b].forEach(function (x) { x.cols = 2; x.rows = 2; P().screens.push(x); });
    w.commit(); w.renderAll();
    w.ui.selSecs = new Set([a.id, b.id]); w.ui.sel = a.id;
    w.alignSections('left');
    var A = P().screens.filter(function (x) { return x.id === a.id; })[0], B = P().screens.filter(function (x) { return x.id === b.id; })[0];
    return A.x === B.x || 'x ' + A.x + ' / ' + B.x;
  });
  // ---------------------------------------------------------------- groups (Ctrl+G, UI cleanup 2026-10-11)
  t('Group / Ungroup: one name, selects as one, and the Send plan + .scr are byte-identical', function () {
    w.showScreen(P().lct[0].id);
    var vis = w.visibleScreens(); if (vis.length < 2) return 'need two blocks of cabinets, have ' + vis.length;
    var d = P().devices[0], sig = function () {
      return JSON.stringify(w.HWSEND.buildSendPlan(w.hwSendModel(d), { modelId: 0x1103, senders: w.cardsOfDevice(d).length, backup: [], freeRoute: false, now: new Date(2026, 9, 11, 12, 0, 0) })) + '|' +   // fixed clock: the plan stamps the time (0x02000011), which made this flaky across a second boundary
        Array.prototype.join.call(w.SCR.build(w.toScrModel()), ',');
    };
    var uu = sig; sig = function () { return uu().replace(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/gi, 'UUID'); };   // NSSD gets fresh UUIDs per build
    if (sig() !== sig()) return 'the signature itself is not stable';
    var before = sig(), had = 'groups' in P();
    w.ui.selSecs = new Set([vis[0].id, vis[1].id]); w.ui.sel = vis[0].id;
    var g = w.groupSections();
    if (!g || vis[0].group !== g.id || vis[1].group !== g.id || g.name !== 'Group 1') return 'not grouped: ' + JSON.stringify(P().groups);
    if (sig() !== before) return 'grouping changed the Send plan or the .scr';
    w.ui.selSecs = new Set(); w.ui.sel = null; w.arrangeToggle(vis[1]);
    if (!(w.ui.selSecs.has(vis[0].id) && w.ui.selSecs.has(vis[1].id))) return 'Ctrl+click did not take the whole group';
    var tree = w.document.querySelector('#tree .tn-grp');
    if (!tree || !/Group 1/.test(tree.textContent)) return 'group missing from the tree';
    w.renameGroup(g, 'Stage left');
    if (w.document.getElementById('secHead').textContent.indexOf('Stage left') !== 0) return 'cabinets card: ' + w.document.getElementById('secHead').textContent;
    w.ungroupSections([vis[0]]);
    if (vis[0].group || vis[1].group || P().groups.length) return 'ungroup left ' + JSON.stringify(P().groups);
    if (sig() !== before) return 'ungrouping changed the Send plan or the .scr';
    if (!had) delete P().groups;
    return true;
  });
  t('no “Section” words in the Layout tab (toolbar, cards, right-click)', function () {
    w.setTab('layout'); w.renderAll();
    var doc = w.document, s = w.visibleScreens()[0]; w.ui.sel = s && s.id; w.renderAll();
    var txt = doc.querySelector('#modLayout .stage-tools').textContent + ' ' + doc.querySelector('#modLayout aside.panel.right').textContent;
    var bb = s && w.screenBounds(s); if (bb) w.openCanvasMenu(10, 10, { x: bb.x + 1, y: bb.y + 1 });
    txt += ' ' + doc.getElementById('ctxMenu').textContent; w.closeMenu();
    var m = txt.match(/[^.]{0,30}\bsections?\b[^.]{0,20}/i);

// The heat map (app-heat.js, PRO_LOOK_PLAN §5.6 / §7.3 #10, #11): readings injected as monitoring would hold them (the
// processor "linked" to a documentation address, its polling paused): the field between a 30 °C and a 50 °C cabinet is
// the mean at their shared edge and exact at the centres; a cabinet without a reading has weight 0 (never 0 °C) and is
// hatched; a dark one is outlined; a backup-fed one is hatched in Temperature; pan / zoom don't rebuild the image, a new

      if (d) { delete w.hlt.by[d.id]; delete w.hlt.watch[d.id]; } w.replaceProject(w.ensureLct(w.newProject())); w.pullProject = keepPull; w.renderAll(); done(); };

      w.pullProject = function () {};
      w.replaceProject(w.ensureLct(w.newProject()));

      d.hw = { kind: 'lct', host: '192.0.2.40', port: 5200, name: 'MCTRL4K', senders: [0x1103] };
      w.hlt.watch[d.id] = { inflight: true };   // no polling in this check
      var list = w.hwPortCells()[C + ':0'] || [], cw = list[0] && list[0].width, ch = list[0] && list[0].height;
      if (list.length !== 8) return fin(false, 'heat map: 8 cabinets on P1 expected, got ' + list.length);
      var read = function (fx) {   // left two columns 30 °C, right two 50 °C; fx(cabinet, col, row) adjusts / drops one
        var cabs = [];
        list.forEach(function (c, j) {
          var col = Math.round(c.x / cw), rw = Math.round(c.y / ch), x = { card: 0, port: 0, index: j, side: 'primary', dark: false, temp: col < 2 ? 30 : 50, tempStatus: 'ok', voltage: 5, voltStatus: 'ok' };
          if (fx) x = fx(x, col, rw);

      var l = w.heatAt(ex - px / 2, ey), r = w.heatAt(ex + px / 2, ey), mid = (l + r) / 2;

      // pan / zoom: same image

      w.renderCanvas(w.allCells()); e = w.heat.cur;

      if (!q('.heat-gaps rect[fill="url(#heatMiss)"]')) bad.push('missing not hatched');
      if (!q('.heat-gaps rect[stroke="#f0484d"]')) bad.push('dark not outlined');
      if (!q('rect[fill="url(#hltHatchFine)"]')) bad.push('backup not hatched in Temperature');
      if (!q('g.heat-num[filter="url(#heatTxt)"] text') || !q('#heatTxt feDropShadow')) bad.push('numbers without the drop shadow');
