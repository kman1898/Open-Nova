name: Problem report
description: Open Nova did the wrong thing, or doesn't work with your processor
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. In the app, **Help ▸ Report a Problem…** makes one zip with everything we need: what Open Nova sent to and received from your processors, the logs, and the models and firmware. Please attach it below.
        The zip never holds passwords. Tick **Anonymise IP addresses** in that dialog if you don't want your network addresses in a public issue. Please leave out show files and client names.
        A security problem? Don't post it here: see [SECURITY.md](https://github.com/kman1898/Open-Nova/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you expect, and what happened instead? Did the wall show something wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you clicked, in order, and which processor it went to.
      placeholder: |
        1. Linked the H5 from Add processor
        2. Drew a screen of 4 × 2 cabinets on port 1
        3. Send ▸ Send to H5
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Report zip
      description: Drag the `OpenNova-report-….zip` from Help ▸ Report a Problem here. If it is too big for GitHub, say so and we'll find another way.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Open Nova version
      description: Help ▸ About shows it (it is also in the window title and at the top of the report).
      placeholder: as in Help ▸ About, e.g. 1.2.0-alpha.3 (build 20261028-…)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Computer
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: processor
    attributes:
      label: Processor model and firmware
      description: As many as were involved. Device info in the app shows them; the report has them too.
      placeholder: H5 with a 20-port sending card, firmware V2.2.0.1
    validations:
      required: true
  - type: input
    id: cards
    attributes:
      label: Receiving cards and connection
      description: Optional. Receiving-card model, and how Open Nova reached the processor (network, USB, serial).
      placeholder: A10s Plus, over the network
  - type: textarea
    id: media
    attributes:
      label: Screenshots or a photo of the wall
      description: Optional, for anything you can see. Please leave out anything private.
