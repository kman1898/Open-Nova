name: CI

# Every test on every push and pull request; on main / alpha (and when release.yml calls it for a tag) also the packages,
# each unzipped and started on Linux, macOS and Windows. How to run all of it locally: docs/TESTING.md.
# The app itself needs nothing but Python 3.9+; only CI installs flake8 and Playwright.

on:
  push:
    branches: [main, alpha]
    tags-ignore: ['**']
  pull_request:
    branches: [main, alpha]
  workflow_dispatch:
  workflow_call:

# A push that is also the head of an open pull request fires both events; the second run for the same ref cancels the first.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version-check:
    name: Version (app/version.json is the one source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: serve.py, serve.ps1, opennova.py, alpha.py and make_package.py agree with app/version.json
        run: python -I -X utf8 tools/test_version.py

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: node --check every script
        run: |
          bad=0
          for f in $(git ls-files '*.js'); do node --check "$f" || { echo "::error file=$f::node --check failed"; bad=1; }; done
          exit $bad
      - name: Python compiles, and parses as Python 3.9 (the oldest the app supports)
        run: |
          git ls-files -z '*.py' | xargs -0 -n1 python -m py_compile
          python - <<'EOF'
          import ast, subprocess
          bad = 0
          for f in subprocess.run(['git', 'ls-files', '*.py'], capture_output=True, text=True).stdout.split('\n'):
              if not f: continue
              try: ast.parse(open(f, encoding='utf-8').read(), f, feature_version=(3, 9))
              except SyntaxError as e: print('::error file=%s,line=%s::not Python 3.9: %s' % (f, e.lineno, e.msg)); bad = 1
          raise SystemExit(bad)
          EOF
      - name: flake8 (fatal errors - syntax, undefined names - must pass; style advisory)
        run: |
          pip install flake8
          git ls-files -z '*.py' | xargs -0 flake8 --count --select=E9,F63,F7,F82 --show-source --statistics
          git ls-files -z '*.py' | xargs -0 flake8 --count --exit-zero --max-line-length=200 --statistics | tail -n 30

  lint-windows:
    name: Lint (Windows PowerShell parses serve.ps1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Parse app/serve.ps1 with Windows PowerShell 5.1 (what users run)
        shell: powershell
        run: |
          $t = $null; $e = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path app/serve.ps1).Path, [ref]$t, [ref]$e)
          if ($e.Count) { $e | ForEach-Object { Write-Host "::error file=app/serve.ps1,line=$($_.Extent.StartLineNumber)::$($_.Message)" }; exit 1 }
          Write-Host "serve.ps1 parses ($($PSVersionTable.PSVersion))"

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      # macOS has only 127.0.0.1 on lo0 and sends UDP datagrams of at most 9 KB: the tests' stand-in processors use more
      # loopback addresses and a 60 KB discovery answer, as Linux and Windows allow out of the box
      - name: macOS loopback addresses and UDP size for the stand-ins
        if: runner.os == 'macOS'
        run: |
          for i in 2 3 4 5 6 7 8 9 42; do sudo ifconfig lo0 alias 127.0.0.$i up; done
          sudo sysctl -w net.inet.udp.maxdgram=65535
      # every tools/test_*.py and app/tests/*_test.js; parts that need private data (recordings, captures, Samples) SKIP
      - name: Run every test
        run: python tools/run_tests.py --json test-results.json
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python }}
          path: test-results.json
          retention-days: 14

  browser:
    name: Browser pages (Chromium ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    # ui_sweep.html alone takes ~6 min (every width x size x theme): it gets a shard of its own (tools/browser_tests.py)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          for i in 1 2 3; do
            python -m playwright install --with-deps chromium && exit 0
            echo "attempt $i failed, retrying in 20 s"; sleep 20
          done
          exit 1
        timeout-minutes: 12
      - name: Run the test pages against a server started from this checkout (helper too, temporary data)
        run: python tools/browser_tests.py --helper --shard ${{ matrix.shard }}/2 --out browser-results
        timeout-minutes: 30
      - name: Keep what the pages showed
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-results-${{ matrix.shard }}
          path: browser-results/
          retention-days: 14

  build:
    name: Packages
    needs: [version-check, lint, lint-windows, test, browser]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # The alpha unlocks with the shared code (tools/alpha_unlock.json, hashes only): no secret needed.
      # OPENNOVA_REPORT_CONTACT (repository variable, optional) = where testers send their reports.
      - name: Build the package and the alpha package
        env:
          OPENNOVA_REPORT_CONTACT: ${{ vars.OPENNOVA_REPORT_CONTACT }}
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          python tools/make_package.py --out dist
          python tools/make_package.py --alpha --out dist
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: open-nova-packages
          path: dist/*.zip
          retention-days: 30

  smoke:
    name: Package starts (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: open-nova-packages
          path: dist
      # unzipped by the system's own tool, as a user would, then started with opennova.py and probed
      - name: Unzip and start each package (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          set -e
          for z in dist/*.zip; do
            d="unzipped/$(basename "$z" .zip)"; mkdir -p unzipped; unzip -q "$z" -d unzipped
            a=""; case "$z" in *-alpha.zip) a="--alpha";; esac
            python tools/smoke_package.py "$z" --dir "$d" $a
          done
      - name: Unzip and start each package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($z in Get-ChildItem dist\*.zip) {
            Expand-Archive -Path $z.FullName -DestinationPath unzipped -Force
            $a = @(); if ($z.Name -like '*-alpha.zip') { $a = @('--alpha') }
            python tools/smoke_package.py $z.FullName --dir (Join-Path unzipped $z.BaseName) @a
            if ($LASTEXITCODE) { exit 1 }
          }
