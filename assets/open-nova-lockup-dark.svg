  <circle cx="128" cy="128" r="72" fill="none" stroke="#ff3d2e" stroke-width="12"/>
  <path d="M128 26Q134 122 230 128Q134 134 128 230Q122 134 26 128Q122 122 128 26Z" fill="#ff3d2e"/>
